---
- name: Verify WordPress
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The MariaDB container that ansible-role-mariadb started, and the client
    # binary inside it. Queries go through it so that the assertions look at the
    # database server itself rather than at anything WordPress reports.
    wordpress_molecule_mariadb_container: mariadb

    # Written into the WordPress document root and fetched back through Apache,
    # so that what it reports is the configuration the serving process actually
    # runs with - not what a file on disk says, and not what a differently
    # configured PHP CLI in the same container would say.
    wordpress_molecule_probe_filename: mash-molecule-probe.php

    # Distinctive enough that finding these in a page proves the page was
    # rendered from the row that was inserted straight into the database.
    wordpress_molecule_dbside_slug: molecule-dbside-5b1c
    wordpress_molecule_dbside_title: Inserted straight into MariaDB 5b1c
    wordpress_molecule_dbside_content: dbside-content-5b1c-2f7a9

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: wordpress_defaults

    - name: Wait for the WordPress systemd service to become active (up to 3m)
      ansible.builtin.systemd:
        name: wordpress.service
      register: wordpress_service
      until: wordpress_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Retrieve the WordPress service log for debugging
      when: wordpress_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu wordpress.service
      changed_when: false

    - name: Wait for WordPress to answer over HTTP (up to 5m)
      ansible.builtin.uri:
        url: "{{ wordpress_molecule_url }}/"
        method: GET
        status_code: [200, 302, 500]
        follow_redirects: none
      register: wordpress_first_response
      until: wordpress_first_response.status | default(0) in [200, 302, 500]
      retries: 60
      delay: 5

    # This assertion proves that the
    # database the role configured is reachable with the credentials the role
    # configured - and it is also what makes every assertion after the install
    # step meaningful, because it establishes that they could not have passed a
    # moment earlier.
    - name: Assert that WordPress is not installed yet and redirects to its installer
      ansible.builtin.assert:
        that:
          - wordpress_first_response.status == 302
          - wordpress_first_response.location | default('') is search('/wp-admin/install[.]php$')
        fail_msg: >-
          Expected an uninstalled WordPress to redirect to /wp-admin/install.php,
          got {{ wordpress_first_response.status }}
          (location: {{ wordpress_first_response.location | default('none') }}).
          A 500 here means WordPress could not reach the database the role configured.
        success_msg: "WordPress is reachable, talks to its database, and is not installed yet"

    - name: Install the PHP probe into the WordPress document root
      ansible.builtin.copy:
        dest: "{{ wordpress_data_path }}/{{ wordpress_molecule_probe_filename }}"
        owner: "{{ wordpress_uid }}"
        group: "{{ wordpress_gid }}"
        mode: "0644"
        content: |
          <?php
          // SPDX-FileCopyrightText: 2026 Slavi Pantaleev
          //
          // SPDX-License-Identifier: AGPL-3.0-or-later
          require '/var/www/html/wp-includes/version.php';
          header('Content-Type: application/json');
          echo json_encode([
              'wp_version' => $wp_version,
              'wp_db_version' => $wp_db_version,
              'upload_max_filesize' => ini_get('upload_max_filesize'),
              'post_max_size' => ini_get('post_max_size'),
              'memory_limit' => ini_get('memory_limit'),
              'max_execution_time' => ini_get('max_execution_time'),
              'tz' => getenv('TZ'),
              'db_host' => getenv('WORDPRESS_DB_HOST'),
              'db_name' => getenv('WORDPRESS_DB_NAME'),
              'db_user' => getenv('WORDPRESS_DB_USER'),
              'table_prefix' => getenv('WORDPRESS_TABLE_PREFIX'),
          ]);

    - name: Ask the serving process what it is running with
      ansible.builtin.uri:
        url: "{{ wordpress_molecule_url }}/{{ wordpress_molecule_probe_filename }}"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: wordpress_probe

    # WordPress carries a two-component version for its `.0` releases (`7.1`),
    # while the container image tags that release `7.1.0`. Compared with a
    # trailing dot so that `7.1` cannot be mistaken for a prefix of `7.10.0`.
    - name: Assert the running WordPress is the version this role installs
      ansible.builtin.assert:
        that:
          - >-
            wordpress_probe.json.wp_version == wordpress_defaults.wordpress_version
            or wordpress_defaults.wordpress_version.startswith(wordpress_probe.json.wp_version ~ '.')
        fail_msg: "WordPress reports {{ wordpress_probe.json.wp_version | default('none') }}, expected {{ wordpress_defaults.wordpress_version }}"
        success_msg: "WordPress reports {{ wordpress_probe.json.wp_version }}"

    - name: Assert that the role's uploads.ini reached PHP
      ansible.builtin.assert:
        that:
          - wordpress_probe.json.upload_max_filesize == wordpress_max_upload_size
          - wordpress_probe.json.post_max_size == wordpress_max_upload_size
          - wordpress_probe.json.memory_limit == wordpress_max_upload_size
          - wordpress_probe.json.max_execution_time == '600'
        fail_msg: >-
          PHP reports upload_max_filesize={{ wordpress_probe.json.upload_max_filesize }},
          post_max_size={{ wordpress_probe.json.post_max_size }},
          memory_limit={{ wordpress_probe.json.memory_limit }},
          max_execution_time={{ wordpress_probe.json.max_execution_time }};
          expected {{ wordpress_max_upload_size }} and 600 from the role's uploads.ini.
        success_msg: "The role's uploads.ini is what PHP is running with"

    - name: Assert that the role's environment file reached the process
      ansible.builtin.assert:
        that:
          - wordpress_probe.json.tz == wordpress_environment_variables_tz
          - wordpress_probe.json.db_name == wordpress_database_name
          - wordpress_probe.json.db_user == wordpress_database_username
          - wordpress_probe.json.db_host == 'localhost:/run-mysqld/mysqld.sock'
          - wordpress_probe.json.table_prefix == wordpress_molecule_table_prefix
        fail_msg: >-
          The serving process sees TZ={{ wordpress_probe.json.tz }},
          WORDPRESS_DB_HOST={{ wordpress_probe.json.db_host }},
          WORDPRESS_DB_NAME={{ wordpress_probe.json.db_name }},
          WORDPRESS_TABLE_PREFIX={{ wordpress_probe.json.table_prefix }},
          which is not what the role's env file says.
        success_msg: "The role's env file, including its pass-through variables, is what the process runs with"

    # Drives WordPress's own installer, non-interactively. Everything asserted
    # after this point is unreachable for an uninstalled WordPress, which the
    # negative control above established is how this instance started out.
    - name: Install WordPress through its own installer
      ansible.builtin.uri:
        url: "{{ wordpress_molecule_url }}/wp-admin/install.php?step=2"
        method: POST
        body_format: form-urlencoded
        body:
          weblog_title: "{{ wordpress_molecule_site_title }}"
          user_name: "{{ wordpress_molecule_admin_username }}"
          admin_password: "{{ wordpress_molecule_admin_password }}"
          admin_password2: "{{ wordpress_molecule_admin_password }}"
          admin_email: "{{ wordpress_molecule_admin_email }}"
          blog_public: "0"
          language: ""
          Submit: Install WordPress
        status_code: [200]
        follow_redirects: none
        timeout: 120
      changed_when: true

    - name: Fetch the WordPress front page
      ansible.builtin.uri:
        url: "{{ wordpress_molecule_url }}/"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: wordpress_front_page

    - name: Assert that WordPress serves the site the installer was given
      ansible.builtin.assert:
        that:
          - "'<title>' ~ wordpress_molecule_site_title ~ '</title>' in wordpress_front_page.content"
        fail_msg: >-
          The front page does not carry the site title the installer was given
          ({{ wordpress_molecule_site_title }}).
        success_msg: "WordPress serves the installed site, no longer the installer"

    - name: Assert that the front page is generated by the version the role pins
      ansible.builtin.assert:
        that:
          - "'<meta name=\"generator\" content=\"WordPress ' ~ wordpress_probe.json.wp_version ~ '\"' in wordpress_front_page.content"
        fail_msg: >-
          The front page does not declare itself generated by
          WordPress {{ wordpress_probe.json.wp_version }}.
        success_msg: "The served pages are generated by WordPress {{ wordpress_probe.json.wp_version }}"

    # First direction: what went in over HTTP has to be findable in the database
    # the role configured, under the table prefix the role passed through.
    - name: Read back the installed site DB-side
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - "{{ wordpress_molecule_mariadb_container }}"
          - mariadb
          - "--user={{ wordpress_database_username }}"
          - "--password={{ wordpress_database_password }}"
          - --batch
          - --skip-column-names
          - "{{ wordpress_database_name }}"
          - --execute
          - >-
            SELECT option_value FROM {{ wordpress_molecule_table_prefix }}options WHERE option_name = 'blogname';
            SELECT user_login FROM {{ wordpress_molecule_table_prefix }}users;
            SELECT option_value FROM {{ wordpress_molecule_table_prefix }}options WHERE option_name = 'db_version';
      register: wordpress_dbside_read
      changed_when: false

    - name: Assert that MariaDB holds what WordPress was installed with
      ansible.builtin.assert:
        that:
          - wordpress_dbside_read.stdout_lines[0] == wordpress_molecule_site_title
          - wordpress_dbside_read.stdout_lines[1] == wordpress_molecule_admin_username
          - wordpress_dbside_read.stdout_lines[2] == wordpress_probe.json.wp_db_version | string
        fail_msg: >-
          {{ wordpress_database_name }} does not hold the installed site:
          {{ wordpress_dbside_read.stdout_lines }}
        success_msg: >-
          MariaDB holds the site title, the administrator and db_version
          {{ wordpress_probe.json.wp_db_version }} that WordPress wrote

    # Second direction: what is put into the database has to come back out over
    # HTTP. Together with the first direction this rules out a WordPress that is
    # serving from anywhere else than the database the role pointed it at.
    - name: Insert a post straight into MariaDB
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - "{{ wordpress_molecule_mariadb_container }}"
          - mariadb
          - "--user={{ wordpress_database_username }}"
          - "--password={{ wordpress_database_password }}"
          - --batch
          - --skip-column-names
          - "{{ wordpress_database_name }}"
          - --execute
          - >-
            INSERT INTO {{ wordpress_molecule_table_prefix }}posts
            (post_author, post_date, post_date_gmt, post_content, post_title, post_excerpt,
            post_status, comment_status, ping_status, post_password, post_name, to_ping,
            pinged, post_modified, post_modified_gmt, post_content_filtered, post_type)
            VALUES
            (1, NOW(), UTC_TIMESTAMP(), '{{ wordpress_molecule_dbside_content }}',
            '{{ wordpress_molecule_dbside_title }}', '', 'publish', 'closed', 'closed', '',
            '{{ wordpress_molecule_dbside_slug }}', '', '', NOW(), UTC_TIMESTAMP(), '', 'post');
            SELECT LAST_INSERT_ID();
      register: wordpress_dbside_insert
      changed_when: true

    - name: Fetch the post that only MariaDB knows about
      ansible.builtin.uri:
        url: "{{ wordpress_molecule_url }}/?p={{ wordpress_dbside_insert.stdout_lines[0] | trim }}"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: wordpress_dbside_page

    - name: Assert that WordPress serves the post that was inserted DB-side
      ansible.builtin.assert:
        that:
          - wordpress_molecule_dbside_title in wordpress_dbside_page.content
          - wordpress_molecule_dbside_content in wordpress_dbside_page.content
        fail_msg: >-
          WordPress did not render the post inserted into
          {{ wordpress_molecule_table_prefix }}posts of {{ wordpress_database_name }}.
        success_msg: "WordPress renders what was written straight into the configured database"

    - name: Remove the PHP probe from the WordPress document root
      ansible.builtin.file:
        path: "{{ wordpress_data_path }}/{{ wordpress_molecule_probe_filename }}"
        state: absent

    # `Restart=always` makes a crash-looping container look active, and every
    # check above would still pass against one that happened to be up while it
    # was being asked. A container that has been restarted has crashed.
    - name: Re-read the WordPress systemd service
      ansible.builtin.systemd:
        name: wordpress.service
      register: wordpress_service_final

    - name: Assert that WordPress has been up all along
      ansible.builtin.assert:
        that:
          - wordpress_service_final.status.ActiveState == 'active'
          - wordpress_service_final.status.NRestarts | int == 0
        fail_msg: >-
          wordpress.service is {{ wordpress_service_final.status.ActiveState }}
          after {{ wordpress_service_final.status.NRestarts }} restart(s).
        success_msg: "wordpress.service is active and has never restarted"
